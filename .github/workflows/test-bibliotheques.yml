# Test réel des « bibliothèques fournies avec le paquet »
# Real-world test of bundling missing libraries from official distribution repositories.
#
# Chaque test convertit un vrai paquet pour une distribution où une de ses bibliothèques
# n'existe pas, installe le résultat dans un conteneur propre et lance le programme.
#   - .deb Ubuntu 22.04 (ICU 70)   → .rpm sur Fedora         (bibliothèques prises chez Ubuntu)
#   - paquet Arch (libjpeg.so.8)   → .rpm sur Fedora         (bibliothèque prise chez Arch)
#   - .rpm AlmaLinux 9 (ICU 67)    → .deb sur Ubuntu 24.04   (bibliothèques prises chez AlmaLinux)
#   - .deb Ubuntu 22.04 → .rpm « Fedora » depuis Ubuntu : vérification dans les dépôts de Fedora
#
# Lancement : onglet « Actions » → « Test des bibliothèques fournies » → « Run workflow ».

name: Test des bibliothèques fournies

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cli:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Compilation et tests du moteur
        working-directory: core
        run: |
          cargo test --release
          cargo build --release --bin tamga-cli
      - uses: actions/upload-artifact@v4
        with:
          name: tamga-cli
          path: core/target/release/tamga-cli

  paquets:
    runs-on: ubuntu-24.04
    steps:
      - name: Paquets de test (Ubuntu 22.04, AlmaLinux 9, Arch)
        run: |
          mkdir -p pkgs
          curl -fsSLo pkgs/icu-devtools_70.1-2_amd64.deb \
            https://archive.ubuntu.com/ubuntu/pool/main/i/icu/icu-devtools_70.1-2_amd64.deb
          docker run --rm -v "$PWD/pkgs:/pkgs" almalinux:9 bash -c \
            'dnf -y -q install dnf-plugins-core >/dev/null && dnf -y -q download --destdir /pkgs icu'
          docker run --rm -v "$PWD/pkgs:/pkgs" archlinux:latest bash -c \
            'pacman -Syw --noconfirm --cachedir /pkgs jpegoptim >/dev/null'
          sudo chown -R "$(id -u)" pkgs
          ls -la pkgs
      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: pkgs

  vers-fedora:
    needs: [cli, paquets]
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
      - name: .deb Ubuntu 22.04 → .rpm, installé sur Fedora
        run: |
          set -x
          T=tamga-cli/tamga-cli; chmod +x $T
          $T convert paquets/icu-devtools_70.1-2_amd64.deb --to rpm --online --out out/ 2>&1 | tee log1
          grep "libicuuc.so.70 ←" log1
          dnf -y -q install --nogpgcheck out/*.rpm
          uconv --version | tee v1
          grep "ICU 70" v1
          echo "héllo wörld" | uconv -f utf-8 -t ascii -x Latin-ASCII
      - name: Paquet Arch → .rpm, installé sur Fedora
        run: |
          set -x
          T=tamga-cli/tamga-cli
          P=$(ls paquets/jpegoptim-*.pkg.tar.zst | head -1)
          $T deps "$P" --to rpm --online 2>&1 | tee d2
          $T convert "$P" --to rpm --online --out out2/ 2>&1 | tee log2
          grep "libjpeg.so.8 ←" log2
          dnf -y -q install --nogpgcheck out2/*.rpm
          jpegoptim --version
      - name: Vérification par rpmlint, mode verbeux
        run: |
          set -x
          dnf -y -q install rpmlint >/dev/null
          T=tamga-cli/tamga-cli
          $T convert paquets/icu-devtools_70.1-2_amd64.deb --to rpm --online --test --verbose --out out3/ 2>&1 | tee log5
          grep "check.reopened" log5
          grep "check.digest_ok" log5
          grep -E "rpmlint|E: |W: " log5
          grep "\[en ligne\]" log5

  vers-ubuntu:
    needs: [cli, paquets]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Outils
        run: apt-get update -q && apt-get install -y -q ca-certificates >/dev/null
      - uses: actions/download-artifact@v4
      - name: .rpm AlmaLinux 9 → .deb, installé sur Ubuntu 24.04
        run: |
          set -x
          T=tamga-cli/tamga-cli; chmod +x $T
          P=$(ls paquets/icu-*.el9*.rpm | head -1)
          $T deps "$P" --to deb --online 2>&1 | tee d3
          $T convert "$P" --to deb --online --out out/ 2>&1 | tee log3
          grep "libicuuc.so.67 ←" log3
          apt-get install -y -q ./out/*.deb
          uconv --version | tee v3
          grep "ICU 67" v3
      - name: Plusieurs paquets, dossier de construction, lintian
        run: |
          set -x
          apt-get install -y -q lintian >/dev/null
          T=tamga-cli/tamga-cli
          # Plusieurs paquets d'un coup
          $T convert paquets/icu-devtools_70.1-2_amd64.deb paquets/jpegoptim-*.pkg.tar.zst --to tar --out lot/ 2>&1 | tee l6
          grep "2 réussi" l6
          ls lot/*.tar.gz | wc -l | grep 2
          # Dossier de construction : modifié à la main puis reconstruit
          $T convert paquets/icu-devtools_70.1-2_amd64.deb --to tar --folder --out dossier/ 2>&1
          sed -i 's/^Version: 70.1$/Version: 70.1.7/' dossier/icu-devtools-70.1/package.info
          echo "bonjour" > dossier/icu-devtools-70.1/files/usr/share/doc/ajout.txt
          $T convert dossier/icu-devtools-70.1 --to tar --out refait/ 2>&1
          tar -tzf refait/*.tar.gz | grep "usr/share/doc/ajout.txt"
          ls refait/ | grep "70.1.7"
          # Vérification par lintian
          P=$(ls paquets/icu-*.el9*.rpm | head -1)
          $T convert "$P" --to deb --online --test --fixperms --bump --out out4/ 2>&1 | tee l7
          grep "check.native_ok" l7
          grep -E "lintian|E: |W: " l7

  vers-arch:
    needs: [cli, paquets]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Outils
        run: pacman -Syu --noconfirm --needed namcap >/dev/null
      - uses: actions/download-artifact@v4
      - name: .deb Ubuntu 22.04 → paquet Arch, installé sur Arch
        run: |
          set -x
          T=tamga-cli/tamga-cli; chmod +x $T
          $T convert paquets/icu-devtools_70.1-2_amd64.deb --to arch --online --test --out out/ 2>&1 | tee log8
          grep "libicuuc.so.70 ←" log8
          grep "namcap" log8 || true
          pacman -U --noconfirm out/*.pkg.tar.zst
          /usr/bin/uconv --version | tee v8
          grep "ICU 70" v8

  cible-distante:
    needs: [cli, paquets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - name: .deb Ubuntu 22.04 → .rpm pour Fedora, vérifié dans les dépôts de Fedora
        run: |
          set -x
          T=tamga-cli/tamga-cli; chmod +x $T
          $T deps paquets/icu-devtools_70.1-2_amd64.deb --to rpm --distro fedora --online 2>&1 | tee d4
          grep "libicuuc.so.70" d4 | grep "BUNDLED"
          grep "libstdc++.so.6 " d4 | grep -v "BUNDLED"
