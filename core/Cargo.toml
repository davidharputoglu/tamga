[package]
name = "tamga-core"
version = "0.1.0"
description = "TAMGA — moteur de conversion de paquets Linux (.deb, .rpm, Arch, .sh)"
authors = ["David HARPUTOGLU"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "tamga_core"
path = "src/lib.rs"

[[bin]]
name = "tamga-cli"
path = "src/bin/tamga-cli.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
liblzma = { version = "0.4", default-features = false, features = ["static", "parallel"] }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std", "safe-decode", "safe-encode"] }
zstd = { version = "0.13", features = ["zstdmt"] }
bzip2 = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
memmap2 = "0.9"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[dev-dependencies]
